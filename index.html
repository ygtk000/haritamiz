<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Buluşma Haritamız</title>
<meta name="theme-color" content="#fff6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Haritamız">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: full-screen live map, floating glass top bar, bottom tab bar, bottom sheets for everything else. */
:root{
  --bg:#fff6f8; --surface:#ffffff; --ink:#4a2433; --muted:#9a7584; --accent:#e0607e; --accent-2:#f7b9c8;
  --label:#8f4a63; --halo:#ffffff; --on-accent:#ffffff; --shadow:0 10px 30px rgba(120,40,70,.16);
  --map-filter:sepia(.35) saturate(1.25) hue-rotate(300deg) brightness(1.04) contrast(.95);
  --font-display:"Fraunces", Georgia, serif; --font-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius:20px; --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-app-theme="lavanta"]{ --bg:#1b1530; --surface:#271f40; --ink:#f1eaff; --muted:#a698c9; --accent:#b996f8; --accent-2:#5e4a92; --label:#e2d6ff; --halo:#1b1530;
  --on-accent:#1b1530; --shadow:0 10px 30px rgba(0,0,0,.45); --map-filter:sepia(.4) saturate(1.8) hue-rotate(215deg) brightness(.95); --font-display:"Cormorant Garamond", Georgia, serif; color-scheme:dark;}
:root[data-app-theme="bogaz"]{ --bg:#f1f7fa; --surface:#ffffff; --ink:#173445; --muted:#6b8796; --accent:#2a7fa6; --accent-2:#bfe0ee; --label:#1f5f7c; --halo:#ffffff;
  --on-accent:#ffffff; --shadow:0 10px 30px rgba(20,70,100,.15); --map-filter:sepia(.25) saturate(1.5) hue-rotate(160deg); --font-display:"DM Serif Display", Georgia, serif; color-scheme:light;}
:root[data-app-theme="sonbahar"]{ --bg:#fbf2e8; --surface:#fffaf4; --ink:#43281a; --muted:#9a7560; --accent:#c75b2a; --accent-2:#f2c9a5; --label:#8a4520; --halo:#fffaf4;
  --on-accent:#ffffff; --shadow:0 10px 30px rgba(110,55,20,.16); --map-filter:sepia(.45) saturate(1.3) hue-rotate(-10deg); --font-display:"Fraunces", Georgia, serif; color-scheme:light;}
:root[data-app-theme="matcha"]{ --bg:#f2f6ec; --surface:#fbfdf8; --ink:#25331d; --muted:#738669; --accent:#5b8a47; --accent-2:#cfe2bf; --label:#3f6a2e; --halo:#fbfdf8;
  --on-accent:#ffffff; --shadow:0 10px 30px rgba(40,70,30,.15); --map-filter:sepia(.3) saturate(1.4) hue-rotate(50deg); --font-display:"Fraunces", Georgia, serif; color-scheme:light;}
:root[data-app-theme="yildiz"]{ --bg:#0e1525; --surface:#18233a; --ink:#f3ecd9; --muted:#93a0bb; --accent:#f0c46a; --accent-2:#4b5675; --label:#f3dfae; --halo:#0e1525;
  --on-accent:#1a1406; --shadow:0 10px 30px rgba(0,0,0,.5); --map-filter:sepia(.35) saturate(1.3) hue-rotate(185deg) brightness(.9); --font-display:"Cormorant Garamond", Georgia, serif; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden;transition:background .4s}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}

#map{position:fixed;inset:0;background:var(--bg);z-index:0}
.leaflet-container{font-family:var(--font-body);background:var(--bg)}
.tinted .leaflet-tile-pane .basemap{filter:var(--map-filter)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 75%,transparent) !important;color:var(--muted) !important;font-size:10px !important;margin-bottom:calc(80px + var(--safe-bottom)) !important}
.leaflet-control-attribution a{color:var(--muted) !important}
#petals{position:fixed;inset:0;pointer-events:none;z-index:450}

.topbar{position:fixed;left:12px;right:12px;top:calc(10px + var(--safe-top));z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.brand{pointer-events:auto;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:var(--radius);padding:10px 10px 10px 14px;box-shadow:var(--shadow)}
.brand h1{font-family:var(--font-display);font-weight:600;font-style:italic;font-size:21px;margin:0;line-height:1.1;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.brand .grow{flex:1;min-width:0}
.iconbtn{width:40px;height:40px;border-radius:14px;border:0;background:color-mix(in srgb,var(--accent-2) 55%,transparent);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
.cityrow{pointer-events:auto;display:flex;gap:8px;align-self:flex-start;flex-wrap:wrap}
.seg{display:flex;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.searchbox{pointer-events:auto;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px}
.searchbox input{border:0;background:var(--bg);border-radius:12px;padding:11px 12px;width:100%;outline:none}
.results{max-height:45vh;overflow:auto;display:flex;flex-direction:column}
.results button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;display:flex;flex-direction:column;gap:1px}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.results small{color:var(--muted);font-size:12px;line-height:1.3}

.pickbar{position:fixed;left:12px;right:12px;bottom:calc(88px + var(--safe-bottom));z-index:520;background:var(--surface);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);max-width:560px;margin:0 auto;max-height:52vh;overflow:auto}
.pickbar .top{display:flex;gap:10px;align-items:center}
.pickbar p{margin:0;flex:1;font-weight:700;font-size:14px}
.pickbar p small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.pickbar .flabel{margin-top:2px}

.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));z-index:510;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;box-shadow:var(--shadow);height:64px;padding:0 6px;max-width:560px;margin:0 auto}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0}
.nav button svg{width:22px;height:22px;stroke:currentColor}
.nav button[aria-current="page"]{color:var(--accent)}
.fab{width:60px;height:60px;border-radius:22px;border:0;background:var(--accent) !important;display:grid !important;place-items:center;margin:-26px auto 0;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
.fab svg{width:28px !important;height:28px !important;stroke:var(--on-accent) !important}

.scrim{position:fixed;inset:0;background:rgba(20,10,20,.32);z-index:600;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:610;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:calc(100% - 48px - var(--safe-top));display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--accent-2);margin:10px auto 2px;flex:none}
.sheet header{display:flex;align-items:center;gap:10px;padding:8px 18px 10px;flex:none}
.sheet header h2{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;flex:1;line-height:1.15;text-wrap:balance}
.sheet .body{overflow:auto;padding:0 18px calc(22px + var(--safe-bottom));-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:16px}
.close{width:36px;height:36px;border-radius:12px;border:0;background:var(--bg);display:grid;place-items:center;flex:none}
.close svg{width:18px;height:18px;stroke:var(--ink)}

.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.input{border:1.5px solid color-mix(in srgb,var(--accent-2) 80%,transparent);background:var(--bg);border-radius:14px;padding:12px 13px;width:100%;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.locbox{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:10px 12px}
.locbox .t{flex:1;min-width:0}
.locbox .t b{display:block;font-size:14px}
.locbox .t small{color:var(--muted);display:block}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:var(--bg);color:var(--ink);text-decoration:none;display:inline-block;text-align:center}
.btn.small{padding:8px 12px;font-size:13px;border-radius:11px;background:color-mix(in srgb,var(--accent-2) 55%,transparent)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:#d9485f;color:#fff}
.btn[disabled]{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid color-mix(in srgb,var(--accent-2) 90%,transparent);background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.static{background:color-mix(in srgb,var(--accent-2) 45%,transparent);border-color:transparent}
.chip small{font-weight:600;opacity:.75}
.addact{display:flex;gap:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:9px;border:0;background:rgba(0,0,0,.55);color:#fff;font-weight:800;line-height:1}
.thumb.busy img{opacity:.45}
.thumb .spin{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800}
.addphoto{aspect-ratio:1;border-radius:14px;border:2px dashed var(--accent-2);display:grid;place-items:center;text-align:center;font-size:12px;font-weight:800;color:var(--muted);background:transparent;padding:6px}
.err{color:#c23a50;font-size:13px;font-weight:700}
.ok{color:var(--accent);font-size:13px;font-weight:700}
.hint{color:var(--muted);font-size:13px;margin:0}
.formfoot{display:flex;gap:10px;position:sticky;bottom:calc(-22px - var(--safe-bottom));background:var(--surface);padding:10px 0 calc(16px + var(--safe-bottom));margin-bottom:calc(-22px - var(--safe-bottom));box-shadow:0 -12px 14px -10px rgba(0,0,0,.12)}
.formfoot .btn{flex:1}

.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px}
.gallery img{height:260px;max-width:86%;border-radius:18px;object-fit:cover;scroll-snap-align:center;flex:none;background:var(--bg)}
.gallery img:only-child{max-width:100%;width:100%}
.meta{display:flex;flex-direction:column;gap:4px}
.meta .date{font-weight:800;color:var(--accent);font-size:13px;letter-spacing:.03em}
.meta .place{color:var(--muted);font-size:14px}
.note{white-space:pre-wrap;font-size:16px;line-height:1.6;margin:0;max-width:65ch}
.by{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{background:var(--bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}

.month{font-family:var(--font-display);font-style:italic;font-size:19px;margin:6px 0 -6px;color:var(--muted)}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;border:0;background:var(--bg);border-radius:18px;padding:8px;text-align:left;width:100%}
.card .ph{width:76px;height:76px;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--accent-2) 50%,transparent);display:grid;place-items:center}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph svg{width:30px;height:30px;fill:var(--accent);opacity:.7}
.card b{font-size:16px;display:block;line-height:1.25}
.card small{color:var(--muted);display:block;margin-top:2px}
.card .acts{font-size:12px;color:var(--accent);font-weight:700;margin-top:4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;font-family:var(--font-display);font-size:22px;color:var(--ink);margin-bottom:6px}

.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.theme{border:2px solid transparent;border-radius:18px;padding:10px;text-align:left;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.theme[aria-pressed="true"]{border-color:var(--accent)}
.theme .sw{height:64px;border-radius:12px;position:relative;overflow:hidden;display:block}
.theme .sw i{position:absolute;border-radius:50%}
.theme b{font-size:14px}
.theme small{color:var(--muted);font-size:12px;margin-top:-6px}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mstyle{border:2px solid transparent;border-radius:16px;padding:6px;background:var(--bg);display:flex;flex-direction:column;gap:6px;align-items:stretch;font-size:12px;font-weight:800}
.mstyle[aria-pressed="true"]{border-color:var(--accent)}
.mstyle img{width:100%;aspect-ratio:1;border-radius:11px;object-fit:cover;background:var(--accent-2);display:block}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:16px;padding:12px 14px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;font-weight:700}

.pin{width:42px;height:50px;position:relative;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.pin svg{width:42px;height:50px}
.pin .n{position:absolute;top:-6px;right:-8px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.pin img{position:absolute;left:7px;top:5px;width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--surface)}
.temp-pin{animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.dlbl{white-space:nowrap;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--label);transform:translate(-50%,-50%);pointer-events:none;
  text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 4px var(--halo),0 0 6px var(--halo)}
.toast{position:fixed;left:50%;top:calc(130px + var(--safe-top));transform:translateX(-50%);z-index:900;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:var(--shadow);max-width:90vw;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.welcome{position:fixed;left:12px;right:12px;bottom:calc(90px + var(--safe-bottom));z-index:505;background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto}
.welcome b{font-family:var(--font-display);font-size:20px;font-style:italic}
.welcome p{margin:0;color:var(--muted);font-size:14px}
.lightbox{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:calc(20px + var(--safe-top)) 10px calc(20px + var(--safe-bottom))}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.lightbox button{position:absolute;top:calc(14px + var(--safe-top));right:14px;width:42px;height:42px;border-radius:14px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px}

/* auth gate */
.gate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--safe-top)) 20px calc(24px + var(--safe-bottom));overflow:auto}
.gatecard{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.gatecard .logo{width:84px;height:84px;border-radius:24px;box-shadow:var(--shadow)}
.gatecard h1{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:34px;line-height:1.05;margin:4px 0 0;text-wrap:balance}
.gatecard p{margin:0;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:800;padding:4px 0;text-align:left}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}.temp-pin{animation:none}}
@media (min-width:700px){.topbar{right:auto;width:420px}}
</style>
</head>
<body>
<div id="map" aria-label="Harita"></div>
<canvas id="petals" aria-hidden="true"></canvas>

<div class="topbar">
  <div class="brand">
    <div class="grow">
      <h1>Buluşma Haritamız</h1>
      <div class="sub" id="subline">Yükleniyor…</div>
    </div>
    <button class="iconbtn" id="searchBtn" aria-label="Yer ara"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="iconbtn" id="layersBtn" aria-label="Harita görünümü"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
  </div>
  <div class="searchbox hidden" id="searchBox">
    <input id="searchInput" type="search" placeholder="Dükkan, kafe, sokak, mahalle…" autocomplete="off" aria-label="Haritada yer ara">
    <div class="results" id="searchResults"></div>
  </div>
  <div class="cityrow">
    <div class="seg" role="group" aria-label="Şehir">
      <button id="cityIst" aria-pressed="true">İstanbul</button>
      <button id="cityBur" aria-pressed="false">Bursa</button>
    </div>
  </div>
</div>

<div class="welcome hidden" id="welcome">
  <b>İlk anınızı haritaya iliştirin</b>
  <p>Ortadaki artı düğmesine dokunun, buluştuğunuz yeri seçin; fotoğraf, not ve o gün yaptıklarınızı ekleyin.</p>
</div>

<div class="pickbar hidden" id="pickBar" role="status">
  <div class="top">
    <p id="pickText">Buluştuğunuz yere dokunun<small>Haritayı yakınlaştırınca dükkanlar ve sokaklar görünür</small></p>
    <button class="btn small" id="pickCancel">Vazgeç</button>
    <button class="btn primary hidden" id="pickOk">Burası</button>
  </div>
  <div id="nearbyWrap" class="hidden"><span class="flabel">Yakındaki mekânlar</span><div class="chips" id="nearby" style="margin-top:6px"></div></div>
</div>

const NOM="https://nominatim.openstreetmap.org";
async function reverse(lat,lng){
  try{const r=await fetch(NOM+"/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=tr&lat="+lat+"&lon="+lng);if(!r.ok)return null;const j=await r.json();
    const a=j.address||{};
    const street=[a.road||a.pedestrian||a.footway||"",a.house_number||""].join(" ").trim();
    const hood=a.neighbourhood||a.quarter||a.suburb||"";const town=a.town||a.city_district||a.district||a.county||"";
    return{name:j.name&&j.name!==a.road?j.name:"",address:[street,hood,town].filter(Boolean).join(", ")};}catch(e){return null;}
}
async function nearby(lat,lng){
  const q='[out:json][timeout:12];(nwr(around:90,'+lat+','+lng+')["name"]["shop"];nwr(around:90,'+lat+','+lng+')["name"]["amenity"~"cafe|restaurant|fast_food|bar|pub|ice_cream|cinema|theatre|library|bakery|food_court|nightclub"];nwr(around:120,'+lat+','+lng+')["name"]["leisure"~"park|garden"];nwr(around:120,'+lat+','+lng+')["name"]["tourism"];);out center 40;';
  try{const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
    if(!r.ok)return[];const j=await r.json();
    const out=[];for(const e of j.elements||[]){const t=e.tags||{};const la=e.lat||(e.center&&e.center.lat),lo=e.lon||(e.center&&e.center.lon);if(!la)continue;
      const kind=t.amenity||t.shop||t.leisure||t.tourism||"";out.push({name:t.name,kind:KIND[kind]||"",lat:la,lng:lo,d:Math.hypot((la-lat)*111,(lo-lng)*85)});}
    const seen=new Set();return out.sort((a,b)=>a.d-b.d).filter(x=>!seen.has(x.name)&&seen.add(x.name)).slice(0,12);}catch(e){return[];}
}

async function signUrls(paths){
  const need=[...new Set(paths)].filter(p=>p&&!S.urls[p]);if(!need.length)return;
  for(let i=0;i<need.length;i+=100){const chunk=need.slice(i,i+100);
    const {data,error}=await sb.storage.from("photos").createSignedUrls(chunk,60*60*24*6);
    if(!error&&data)for(const d of data)if(d.signedUrl)S.urls[d.path]=d.signedUrl;}
}

$("fileInput").addEventListener("change",async e=>{
  const files=[...e.target.files];e.target.value="";if(!files.length||!S.draft)return;const d=S.draft;
  await Promise.all(files.map(async f=>{const key=Math.random().toString(36).slice(2);const preview=URL.createObjectURL(f);pending.set(key,preview);renderThumbs();
    try{const blob=await shrink(f);const path=S.uid+"/"+crypto.randomUUID()+".jpg";
      const {error}=await sb.storage.from("photos").upload(path,blob,{contentType:blob.type||"image/jpeg",cacheControl:"31536000"});
      if(error)throw error;await signUrls([path]);d.photos.push(path);}
    catch(err){toast("Bir fotoğraf yüklenemedi, tekrar dene.");}
    finally{pending.delete(key);URL.revokeObjectURL(preview);if(S.draft===d)renderThumbs();}}));
});
async function shrink(file){
  try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const max=2000,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return b||file;}catch(e){return file;}
}
async function saveDraft(){
  const d=S.draft,err=$("fErr");err.textContent="";
  if(typeof d.lat!=="number"){err.textContent="Önce haritadan buluştuğunuz yeri seç.";return;}
  if(!d.date){err.textContent="Bir tarih seç.";return;}
  if(pending.size){err.textContent="Fotoğraflar yüklenirken biraz bekle.";return;}
  const btn=$("fSave");btn.disabled=true;btn.textContent="Kaydediliyor…";
  const row={title:(d.title||"").trim()||(d.place_name||"").trim()||"Buluşmamız",date:d.date,place_name:(d.place_name||"").trim(),address:d.address||"",note:d.note||"",
    acts:d.acts.slice(0,30),photos:d.photos.slice(0,40),lat:+d.lat.toFixed(6),lng:+d.lng.toFixed(6),city:d.city||cityOf(d.lat,d.lng),updated_at:new Date().toISOString()};
  let res;
  if(d.id){
    const old=memById(d.id);res=await sb.from("memories").update(row).eq("id",d.id).select().single();
    if(!res.error&&old){const gone=(old.photos||[]).filter(p=>row.photos.indexOf(p)<0);if(gone.length)sb.storage.from("photos").remove(gone);}
  }else res=await sb.from("memories").insert(row).select().single();
  if(res.error){btn.disabled=false;btn.textContent="Kaydet";err.textContent="Kaydedilemedi, bağlantını kontrol edip tekrar dene.";return;}
  upsertLocal(res.data);S.draft=null;closeSheet();toast("Anınız kaydedildi");
  map.flyTo([row.lat,row.lng],Math.max(map.getZoom(),16),{duration:.8});setTimeout(()=>openDetail(res.data.id),900);
}

/* ---------- petals ---------- */
const pc=$("petals"),px=pc.getContext("2d");let parts=[],raf=0;
S.mapStyle=MAPSTYLES.some(m=>m.id===S.mapStyle)?S.mapStyle:"themed";
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function setupPetals(){
  cancelAnimationFrame(raf);px.clearRect(0,0,pc.width,pc.height);parts=[];
  if(!S.petals||reduce){pc.style.display="none";return;}pc.style.display="block";
  const dpr=Math.min(2,window.devicePixelRatio||1);pc.width=innerWidth*dpr;pc.height=innerHeight*dpr;px.setTransform(dpr,0,0,dpr,0,0);
  const kind=(THEMES.find(t=>t.id===S.theme)||THEMES[0]).petal;const n=Math.round(Math.min(22,innerWidth/24));
  for(let i=0;i<n;i++)parts.push(spawn(kind,true));let last=performance.now();
  const step=t=>{const dt=Math.min(50,t-last)/16.7;last=t;px.clearRect(0,0,innerWidth,innerHeight);
    for(const p of parts){p.y+=p.vy*dt;p.x+=Math.sin((p.y+p.ph)/60)*p.sway*dt+p.vx*dt;p.r+=p.vr*dt;p.tw+=.05*dt;
      if(p.y>innerHeight+20||p.y<-30||p.x>innerWidth+30||p.x<-30)Object.assign(p,spawn(kind,false));draw(p,kind);}
    raf=requestAnimationFrame(step);};
  raf=requestAnimationFrame(step);
}
function spawn(kind,init){const up=kind==="bubble",star=kind==="star";return{x:Math.random()*innerWidth,y:init||star?Math.random()*innerHeight:(up?innerHeight+10:-20),
  vy:star?0:up?-(.3+Math.random()*.5):.55+Math.random()*.6,vx:star?0:.15+Math.random()*.25,sway:star?0:.4+Math.random()*.6,ph:Math.random()*400,
  r:Math.random()*6.28,vr:star?0:(Math.random()-.5)*.04,s:star?1.5+Math.random()*2:6+Math.random()*6,tw:Math.random()*6,a:.55+Math.random()*.4};}
function draw(p,kind){px.save();px.translate(p.x,p.y);px.rotate(p.r);px.globalAlpha=p.a;const s=p.s;
  if(kind==="sakura"||kind==="lavender"){px.fillStyle=kind==="sakura"?(p.ph%2<1?"#f7b6c6":"#fbd3dd"):(p.ph%2<1?"#c9b1ff":"#9f86e0");
    px.beginPath();px.moveTo(0,-s);px.bezierCurveTo(s*.9,-s*.8,s*.8,s*.5,0,s);px.bezierCurveTo(-s*.8,s*.5,-s*.9,-s*.8,0,-s);px.fill();}
  else if(kind==="leaf"||kind==="green"){px.fillStyle=kind==="leaf"?["#d8742f","#e9a23b","#b8492a"][Math.floor(p.ph)%3]:["#8fbf6f","#6fa257","#b6d69a"][Math.floor(p.ph)%3];
    px.beginPath();px.ellipse(0,0,s*.45,s,0,0,6.28);px.fill();px.strokeStyle="rgba(0,0,0,.15)";px.lineWidth=.8;px.beginPath();px.moveTo(0,-s);px.lineTo(0,s);px.stroke();}
  else if(kind==="bubble"){px.strokeStyle="rgba(42,127,166,.5)";px.lineWidth=1.2;px.beginPath();px.arc(0,0,s*.6,0,6.28);px.stroke();px.fillStyle="rgba(255,255,255,.7)";px.beginPath();px.arc(-s*.2,-s*.2,s*.15,0,6.28);px.fill();}
  else{px.globalAlpha=p.a*(.35+.65*Math.abs(Math.sin(p.tw)));px.fillStyle="#f6dc9a";px.beginPath();for(let i=0;i<4;i++){px.rotate(Math.PI/2);px.lineTo(0,s*2);px.lineTo(s*.35,s*.35);}px.fill();}
  px.restore();}
addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(setupPetals,200);});

/* ---------- search (memories + OpenStreetMap) ---------- */
let sTimer=0,sSeq=0;
$("searchBtn").onclick=()=>{const b=$("searchBox");b.classList.toggle("hidden");if(!b.classList.contains("hidden"))$("searchInput").focus();};
$("searchInput").addEventListener("input",()=>{clearTimeout(sTimer);sTimer=setTimeout(doSearch,450);});
async function doSearch(){
  const raw=$("searchInput").value.trim(),q=trLower(raw),out=$("searchResults"),seq=++sSeq;
  if(q.length<2){out.innerHTML="";return;}
  const res=[];
  for(const m of S.memories)if(trLower((m.title||"")+" "+(m.place_name||"")).includes(q))res.push({t:m.title||"Anı",s:"Anımız · "+fmtDate(m.date),ll:[m.lat,m.lng],z:17,mem:m.id});
  for(const d of DISTRICTS)if(trLower(d.n).startsWith(q))res.push({t:d.n,s:"İlçe · "+CITIES[d.c].name,ll:d.p,z:13});
  render(res,true);
  try{const c=map.getCenter();
    const r=await fetch(NOM+"/search?format=jsonv2&addressdetails=1&limit=10&accept-language=tr&countrycodes=tr&viewbox=27.9,41.65,30.1,39.7&bounded=1&q="+encodeURIComponent(raw));
    const j=await r.json();if(seq!==sSeq)return;
    for(const p of j){const a=p.address||{};const nm=p.name||p.display_name.split(",")[0];
      const area=[a.road,a.neighbourhood||a.quarter||a.suburb,a.town||a.city_district||a.district||a.county,a.province||a.city].filter(Boolean).filter((v,i,arr)=>arr.indexOf(v)===i&&v!==nm).slice(0,3).join(", ");
      res.push({t:nm,s:(KIND[p.type]?KIND[p.type]+" · ":"")+area,ll:[+p.lat,+p.lon],z:18});}
    render(res,false);}catch(e){if(seq===sSeq)render(res,false);}
  function render(list,loading){out.innerHTML="";
    for(const r of list.slice(0,25)){const b=el("button");b.type="button";b.append(el("span",null,r.t),el("small",null,r.s));
      b.onclick=()=>{$("searchBox").classList.add("hidden");$("searchInput").blur();map.flyTo(r.ll,r.z,{duration:.8});
        if(r.mem)setTimeout(()=>openDetail(r.mem),850);else if(S.picking)setTimeout(()=>setPick(r.ll[0],r.ll[1],true,r.t),850);};out.appendChild(b);}
    if(loading)out.appendChild(el("p","hint","Haritada aranıyor…"));else if(!list.length)out.appendChild(el("p","hint","Sonuç yok"));
    [...out.querySelectorAll("p.hint")].forEach(p=>p.style.padding="6px 10px");}
}

/* ---------- header / welcome ---------- */
function updateHeader(){if(!S.loaded)return;const ms=S.memories;const dates=ms.map(m=>m.date).filter(Boolean).sort();
  $("subline").textContent=ms.length?ms.length+" anı · "+new Set(ms.map(m=>m.lat.toFixed(3)+","+m.lng.toFixed(3))).size+" yer · ilk buluşmadan beri "+daysSince(dates[0])+" gün":"Henüz anı eklenmedi";}
function updateWelcome(){$("welcome").classList.toggle("hidden",!(S.loaded&&!S.memories.length&&!S.picking));}
function refreshAll(){renderMarkers();updateHeader();updateWelcome();if(S.sheet==="list"&&S._redrawList)S._redrawList();}
function upsertLocal(row){const i=S.memories.findIndex(m=>m.id===row.id);if(i>=0)S.memories[i]=row;else S.memories.push(row);signUrls(row.photos||[]).then(refreshAll);refreshAll();}

/* ---------- data ---------- */
let channel=null;
async function loadMemories(){
  const {data,error}=await sb.from("memories").select("*").order("date",{ascending:false});
  if(error){$("subline").textContent="Anılar yüklenemedi, bağlantını kontrol et.";return;}
  S.memories=data||[];await signUrls(S.memories.flatMap(m=>m.photos||[]));S.loaded=true;refreshAll();
  const {data:mem}=await sb.from("members").select("user_id,display_name");(mem||[]).forEach(m=>{if(m.display_name)S.names[m.user_id]=m.display_name;});
}
function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("memories-live").on("postgres_changes",{event:"*",schema:"public",table:"memories"},p=>{
    if(p.eventType==="DELETE"){S.memories=S.memories.filter(m=>m.id!==p.old.id);refreshAll();}else upsertLocal(p.new);
  }).subscribe();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.member)loadMemories();});

/* ---------- auth gate ---------- */
function gate(view,msg){
  const g=$("gate"),c=$("gateCard");g.classList.remove("hidden");c.innerHTML="";
  const logo=el("img","logo");logo.src="icon-192.png";logo.alt="";c.appendChild(logo);
  if(view==="login"||view==="signup"){
    const signup=view==="signup";
    c.appendChild(el("h1",null,signup?"Hesap oluştur":"Buluşma Haritamız"));
    c.appendChild(el("p",null,signup?"Sadece ikiniz için. Hesabı açtıktan sonra eşleşme kodunu gireceksin.":"Birlikte gittiğiniz yerlerin haritası. Devam etmek için giriş yap."));
    const f=document.createElement("form");f.className="gatecard";f.style.gap="12px";
    f.innerHTML='<div class="field"><label for="gEmail">E-posta</label><input class="input" id="gEmail" type="email" autocomplete="email" required></div>'+
      '<div class="field"><label for="gPass">Şifre</label><input class="input" id="gPass" type="password" minlength="6" autocomplete="'+(signup?"new-password":"current-password")+'" required></div>'+
      '<span class="err" id="gErr"></span><button class="btn primary" type="submit" id="gGo">'+(signup?"Hesap oluştur":"Giriş yap")+'</button>';
    c.appendChild(f);if(msg)f.querySelector("#gErr").textContent=msg;
    const sw=el("button","linkbtn",signup?"Zaten hesabım var, giriş yap":"Hesabın yok mu? Hesap oluştur");sw.type="button";sw.onclick=()=>gate(signup?"login":"signup");c.appendChild(sw);
    f.onsubmit=async e=>{e.preventDefault();const em=$("gEmail").value.trim(),pw=$("gPass").value,er=$("gErr"),go=$("gGo");er.textContent="";go.disabled=true;
      if(signup){const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});go.disabled=false;
        if(error){er.textContent=trErr(error);return;}
        if(!data.session){gate("confirm",em);return;}}
      else{const {error}=await sb.auth.signInWithPassword({email:em,password:pw});go.disabled=false;if(error){er.textContent=trErr(error);return;}}
    };
  }else if(view==="confirm"){
    c.appendChild(el("h1",null,"E-postanı kontrol et"));
    c.appendChild(el("p",null,msg+" adresine bir onay bağlantısı gönderdik. Bağlantıya dokun, sonra buraya dönüp giriş yap."));
    const b=el("button","btn primary","Giriş yap");b.onclick=()=>gate("login");c.appendChild(b);
  }else if(view==="join"){
    c.appendChild(el("h1",null,"Eşleşme kodu"));
    c.appendChild(el("p",null,"Bu harita sadece iki kişilik. Sana verilen kodu ve sevgilinin seni göreceği adı yaz."));
    const f=document.createElement("form");f.className="gatecard";f.style.gap="12px";
    f.innerHTML='<div class="field"><label for="jCode">Kod</label><input class="input" id="jCode" autocomplete="off" autocapitalize="characters" placeholder="SAKURA-XXXX-XXXX" required></div>'+
      '<div class="field"><label for="jName">Adın</label><input class="input" id="jName" maxlength="40" required></div><span class="err" id="jErr"></span><button class="btn primary" type="submit" id="jGo">Haritamıza katıl</button>';
    c.appendChild(f);if(msg)f.querySelector("#jErr").textContent=msg;
    f.onsubmit=async e=>{e.preventDefault();$("jGo").disabled=true;const {data,error}=await sb.rpc("join_couple",{p_code:$("jCode").value,p_name:$("jName").value});$("jGo").disabled=false;
      if(error||!data){$("jErr").textContent="Kod yanlış ya da bu harita zaten iki kişi tarafından kullanılıyor.";return;}enterApp();};
    const out=el("button","linkbtn","Başka hesapla giriş yap");out.type="button";out.onclick=async()=>{await sb.auth.signOut();};c.appendChild(out);
  }
}
function trErr(e){const m=(e&&e.message)||"";
  if(/Invalid login/i.test(m))return"E-posta ya da şifre yanlış.";if(/not confirmed/i.test(m))return"Önce e-postandaki onay bağlantısına dokunmalısın.";
  if(/already registered/i.test(m))return"Bu e-postayla zaten hesap var, giriş yap.";if(/Password/i.test(m))return"Şifre en az 6 karakter olmalı.";
  if(/rate limit/i.test(m))return"Çok fazla deneme oldu, birkaç dakika sonra tekrar dene.";return"Bir sorun oldu: "+m;}
async function enterApp(){
  const {data,error}=await sb.from("members").select("user_id").eq("user_id",S.uid).maybeSingle();
  if(error){gate("join","Bağlantı sorunu, tekrar dene.");return;}
  if(!data){gate("join");return;}
  S.member=true;$("gate").classList.add("hidden");await loadMemories();subscribe();
}
sb.auth.onAuthStateChange((ev,session)=>{
  const uid=session&&session.user&&session.user.id;
  if(!uid){S.uid=null;S.member=false;if(channel){sb.removeChannel(channel);channel=null;}gate("login");return;}
  if(uid!==S.uid){S.uid=uid;setTimeout(enterApp,0);}
});

/* ---------- boot ---------- */
setMapStyle(S.mapStyle);applyTheme(S.theme);updateDistrictLabels();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
